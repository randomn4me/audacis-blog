name: Link Check

# Catch broken *internal* links on every PR. Offline only: external link
# liveness is covered weekly by link-check-live.yml, and checking third-party
# sites here would make PRs fail on others' downtime. /search is a JS-handled
# modal link (templates intercept the click), so it is excluded.
#
# Runs on a node image because the runner has no node in the container, so
# actions/checkout (a JS action) needs one; git is installed before checkout.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  link-check:
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Install git + tools
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl tar ca-certificates >/dev/null

      - uses: actions/checkout@v4

      - name: Install zola + lychee
        run: |
          set -e
          # Runner is arm64; pick binaries by arch so this survives a runner change.
          case "$(uname -m)" in
            aarch64) ZARCH=aarch64-unknown-linux-gnu; LARCH=aarch64-unknown-linux-musl ;;
            x86_64)  ZARCH=x86_64-unknown-linux-gnu;  LARCH=x86_64-unknown-linux-musl ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          # Some release tarballs nest the binary in a dir (arm64 lychee does),
          # others are flat. Extract to a tmp dir and install by name either way.
          fetch_bin() {
            tmp=$(mktemp -d)
            curl -sL "$1" | tar xz -C "$tmp"
            install -m 0755 "$(find "$tmp" -type f -name "$2" | head -1)" "/usr/local/bin/$2"
            rm -rf "$tmp"
          }
          fetch_bin "https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-${ZARCH}.tar.gz" zola
          fetch_bin "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-${LARCH}.tar.gz" lychee

      - name: Build site
        run: zola build

      - name: Check internal links
        run: lychee --offline --root-dir "$PWD/public" --exclude '/search$' --no-progress public/
