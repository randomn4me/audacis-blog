name: Link Check

on:
  pull_request:
    branches: [main]

jobs:
  link-check:
    runs-on: docker
    container:
      image: ghcr.io/getzola/zola:v0.19.2
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: zola build

      - name: Install lychee
        run: |
          apk add --no-cache curl tar
          curl -sL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin

      - name: Check links
        run: lychee --base public --no-progress public/
