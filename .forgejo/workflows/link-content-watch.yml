name: Link Content Watch

# Detect when the content *behind* a still-working cited link changes.
# Complements the lychee checks (which only catch broken links). Fetches each
# external URL from content/**/*.md over HTTP, extracts its text, and diffs
# against the committed snapshot in .linkwatch/. On drift it files one Forgejo
# issue and commits the refreshed snapshots so it fires once per change.
#
# Shell-only on purpose: the runner has no node in the python container, so JS
# actions like actions/checkout fail. We clone via git instead.
#
# Requires a repo secret LINKWATCH_TOKEN: an access token with issue write +
# repo content write scope (clones, files the issue, pushes snapshots).

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00, after the live link check (08:00)
  workflow_dispatch:

jobs:
  watch:
    runs-on: docker
    timeout-minutes: 30   # rendering ~68 pages headless overruns the default cap
    container:
      image: python:3.12-slim
    steps:
      - name: Clone repo
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          LINKWATCH_TOKEN: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          host="${SERVER_URL#https://}"
          git clone --depth 1 "https://${OWNER}:${LINKWATCH_TOKEN}@${host}/${REPO}.git" /src

      - name: Set up Python env
        run: |
          set -e
          pip install --no-cache-dir -q uv
          uv venv /opt/lw
          . /opt/lw/bin/activate
          uv pip install -q "kreuzberg==4.9.9"

      - name: Check link content
        env:
          FORGEJO_API: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          cd /src
          . /opt/lw/bin/activate
          # OS-level timeout: kills the process even if a native (kreuzberg)
          # call hangs past the in-script budget. Per-URL snapshots already
          # written persist for the commit step.
          timeout --kill-after=15s 200s python scripts/linkwatch.py > /tmp/lw.log 2>&1
          echo "script exit: $?" >> /tmp/lw.log
          tail -40 /tmp/lw.log

      - name: Report run log (temporary diagnostic)
        if: always()
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOK: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          log = open('/tmp/lw.log').read()[-12000:]
          api = os.environ['SERVER_URL'] + '/api/v1/repos/' + os.environ['REPO'] + '/issues'
          data = json.dumps({'title': 'lw run log', 'body': '```\n' + log + '\n```'}).encode()
          req = urllib.request.Request(api, data=data, method='POST', headers={
              'content-type': 'application/json', 'authorization': 'token ' + os.environ['TOK']})
          print('posted', urllib.request.urlopen(req, timeout=30).status)
          PY

      - name: Commit refreshed snapshots
        run: |
          set -e
          cd /src
          git config user.name "linkwatch[bot]"
          git config user.email "blog@audacis.net"
          git add .linkwatch
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore(linkwatch): update content snapshots"
            git push origin HEAD:main
          fi
