name: lc-diag

# Temporary: reproduce the FIXED link-check steps and publish the captured log
# to a Forgejo issue (the API does not expose run logs). Delete after.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Install git + tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl tar ca-certificates >/dev/null

      - uses: actions/checkout@v4

      - name: Capture real steps
        run: |
          exec > /tmp/diag.log 2>&1
          set -x
          set +e
          case "$(uname -m)" in
            aarch64) ZARCH=aarch64-unknown-linux-gnu; LARCH=aarch64-unknown-linux-musl ;;
            x86_64)  ZARCH=x86_64-unknown-linux-gnu;  LARCH=x86_64-unknown-linux-musl ;;
          esac
          curl -sL "https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-${ZARCH}.tar.gz" | tar xz -C /usr/local/bin
          curl -sL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-${LARCH}.tar.gz" | tar xz -C /usr/local/bin
          ls -la /usr/local/bin
          zola --version
          lychee --version
          zola build
          echo "ZOLA_BUILD_EXIT=$?"
          ls public | head
          lychee --offline --root-dir "$PWD/public" --exclude '/search$' public/
          echo "LYCHEE_EXIT=$?"
          true

      - name: Publish log to issue
        if: always()
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOK: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          node -e '
            const fs=require("fs");
            let log=fs.readFileSync("/tmp/diag.log","utf8").slice(-55000);
            const api=process.env.SERVER_URL+"/api/v1/repos/"+process.env.REPO+"/issues";
            fetch(api,{method:"POST",headers:{"content-type":"application/json","authorization":"token "+process.env.TOK},body:JSON.stringify({title:"lc-diag output",body:"```\n"+log+"\n```"})})
              .then(async r=>{console.log("status",r.status);console.log((await r.text()).slice(0,200));})
              .catch(e=>{console.error(e);process.exit(1)});
          '
