name: lc-live-diag

# Temporary: bounded mirror of link-check-live with -vv + timing, publishes the
# captured log to an issue. Every command is time-bounded so Publish always
# runs. Delete after diagnosing.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Capture
        run: |
          exec > /tmp/d.log 2>&1
          set -x
          set +e
          date +%T; echo "apt start"
          timeout 90 apt-get update -qq
          timeout 90 apt-get install -y -qq --no-install-recommends curl tar ca-certificates >/dev/null
          date +%T; echo "apt done"
          mkdir -p /tmp/l
          timeout 60 bash -c 'curl -sL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-aarch64-unknown-linux-musl.tar.gz" | tar xz -C /tmp/l'
          echo "dl_exit=$?"
          install -m 0755 "$(find /tmp/l -type f -name lychee | head -1)" /usr/local/bin/lychee
          date +%T; lychee --version
          date +%T; echo "crawl start"
          timeout --kill-after=10s 60s lychee --no-progress --max-retries 1 --timeout 15 --max-concurrency 8 --accept '200..=299,403,429,999' -vv https://audacis.net/
          echo "lychee_exit=$?"
          date +%T; echo "crawl end"

      - name: Publish
        if: always()
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOK: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          node -e '
            const fs=require("fs");
            let log=fs.readFileSync("/tmp/d.log","utf8").slice(-50000);
            const api=process.env.SERVER_URL+"/api/v1/repos/"+process.env.REPO+"/issues";
            fetch(api,{method:"POST",headers:{"content-type":"application/json","authorization":"token "+process.env.TOK},body:JSON.stringify({title:"lc-live-diag output",body:"```\n"+log+"\n```"})})
              .then(async r=>console.log("status",r.status,(await r.text()).slice(0,120)))
              .catch(e=>{console.error(e);process.exit(1)});
          '
