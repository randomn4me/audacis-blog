name: lc-live-diag

# Temporary: node-driven so the POST always happens. node runs lychee with its
# own timeout, captures partial -vv output even on kill, then posts to an issue.
# Delete after diagnosing.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Install lychee
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl tar ca-certificates >/dev/null
          tmp=$(mktemp -d)
          curl -sL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-aarch64-unknown-linux-musl.tar.gz" | tar xz -C "$tmp"
          install -m 0755 "$(find "$tmp" -type f -name lychee | head -1)" /usr/local/bin/lychee

      - name: Crawl + publish
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOK: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          node -e '
            const {execSync}=require("child_process");
            const t0=Date.now();
            let out="", code=0;
            try {
              out=execSync("lychee --no-progress --max-retries 1 --timeout 15 --max-concurrency 8 --accept \"200..=299,403,429,999\" -vv https://audacis.net/ 2>&1",{timeout:90000,encoding:"utf8",maxBuffer:1<<24});
            } catch(e){
              code=e.status==null?-1:e.status;
              out=(e.stdout||"")+"\n[execSync error] "+e.message+(e.signal?" signal="+e.signal:"");
            }
            out="elapsed "+Math.round((Date.now()-t0)/1000)+"s exit="+code+"\n\n"+out;
            out=out.slice(-50000);
            const api=process.env.SERVER_URL+"/api/v1/repos/"+process.env.REPO+"/issues";
            fetch(api,{method:"POST",headers:{"content-type":"application/json","authorization":"token "+process.env.TOK},body:JSON.stringify({title:"lc-live-diag output",body:"```\n"+out+"\n```"})})
              .then(async r=>console.log("post",r.status,(await r.text()).slice(0,120)))
              .catch(e=>{console.error(e);process.exit(1)});
          '
