name: lc-live-diag

# Temporary: single step, lychee SIGKILL-bounded then POST in the same shell.
# Delete after diagnosing.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    steps:
      - name: crawl + post
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOK: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          set +e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl tar ca-certificates >/dev/null
          tmp=$(mktemp -d)
          curl -sL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-aarch64-unknown-linux-musl.tar.gz" | tar xz -C "$tmp"
          install -m 0755 "$(find "$tmp" -type f -name lychee | head -1)" /usr/local/bin/lychee
          echo "=== crawl start $(date +%T) ===" > /tmp/o
          timeout --kill-after=15s 45s lychee --no-progress --max-retries 0 --timeout 10 --max-concurrency 8 --accept '200..=299,403,429,999' -vv https://audacis.net/ >> /tmp/o 2>&1
          echo "=== lychee_exit=$? end=$(date +%T) ===" >> /tmp/o
          node -e '
            const fs=require("fs");
            const out=fs.readFileSync("/tmp/o","utf8").slice(-50000);
            const api=process.env.SERVER_URL+"/api/v1/repos/"+process.env.REPO+"/issues";
            fetch(api,{method:"POST",headers:{"content-type":"application/json","authorization":"token "+process.env.TOK},body:JSON.stringify({title:"lc-live-diag output",body:"```\n"+out+"\n```"})})
              .then(async r=>console.log("post",r.status))
              .catch(e=>{console.error(e);process.exit(1)});
          '
