name: lc-live-diag

# Temporary: mirror link-check-live with timing + xtrace, publish the captured
# log to an issue. Delete after diagnosing.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Capture
        run: |
          exec > /tmp/d.log 2>&1
          set -x
          set +e
          date +%T
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl tar ca-certificates >/dev/null
          case "$(uname -m)" in
            aarch64) LARCH=aarch64-unknown-linux-musl ;;
            x86_64)  LARCH=x86_64-unknown-linux-musl ;;
          esac
          tmp=$(mktemp -d)
          curl -sL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-${LARCH}.tar.gz" | tar xz -C "$tmp"
          install -m 0755 "$(find "$tmp" -type f -name lychee | head -1)" /usr/local/bin/lychee
          date +%T; echo "lychee installed"
          lychee --version
          date +%T; echo "running lychee"
          timeout 120 lychee --no-progress --accept '200..=299,429,999' https://audacis.net/
          echo "LYCHEE_EXIT=$?"
          date +%T; echo "done"

      - name: Publish
        if: always()
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOK: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          node -e '
            const fs=require("fs");
            let log=fs.readFileSync("/tmp/d.log","utf8").slice(-50000);
            const api=process.env.SERVER_URL+"/api/v1/repos/"+process.env.REPO+"/issues";
            fetch(api,{method:"POST",headers:{"content-type":"application/json","authorization":"token "+process.env.TOK},body:JSON.stringify({title:"lc-live-diag output",body:"```\n"+log+"\n```"})})
              .then(async r=>console.log("status",r.status,(await r.text()).slice(0,120)))
              .catch(e=>{console.error(e);process.exit(1)});
          '
