name: Link Check (Live)

# Weekly liveness check of the live site's homepage links. lychee can't file
# anything itself, so rather than failing into a red run nobody reads, this
# upserts a single tracking issue when links break and closes it when they
# recover. LinkedIn's bot-block (999) and rate limits (429/503) are accepted so
# they don't masquerade as breakage.
#
# arm64 runner notes:
#   - glibc Debian image, not alpine: the runner executes each step with bash,
#     which alpine lacks, so an alpine container fails instantly.
#   - lychee binary is picked by arch; the arm64 tarball nests it in a subdir.
#   - lychee is hard-bounded (retries/timeout/concurrency + an outer timeout) so
#     a slow or blackholed external link can't run the job for minutes.
#   - the tracking issue is managed with curl, not node's fetch, which stalls on
#     this runner's egress (curl/git/python all reach the API fine).
#
# Needs the LINKWATCH_TOKEN secret (issue write) to manage the tracking issue.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  link-check-live:
    runs-on: docker
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install lychee
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl tar jq ca-certificates >/dev/null
          case "$(uname -m)" in
            aarch64) LARCH=aarch64-unknown-linux-musl ;;
            x86_64)  LARCH=x86_64-unknown-linux-musl ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          tmp=$(mktemp -d)
          curl -sL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-${LARCH}.tar.gz" | tar xz -C "$tmp"
          install -m 0755 "$(find "$tmp" -type f -name lychee | head -1)" /usr/local/bin/lychee
          rm -rf "$tmp"

      - name: Check live site
        run: |
          set +e
          timeout --kill-after=30s 180s \
            lychee --no-progress --max-retries 1 --timeout 20 --max-concurrency 8 \
                   --accept '200..=299,403,429,503,999' https://audacis.net/ > /tmp/lychee.txt 2>&1
          echo $? > /tmp/lychee.exit
          cat /tmp/lychee.txt

      - name: Report via tracking issue
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOK: ${{ secrets.LINKWATCH_TOKEN }}
        run: |
          set -e
          TITLE="Broken links on the live site"
          AUTH="Authorization: token ${TOK}"
          EXIT=$(cat /tmp/lychee.exit)
          NUM=$(curl -sf -H "$AUTH" "${API}/issues?state=open&limit=50&type=issues" \
            | jq -r --arg t "$TITLE" 'map(select(.title==$t)) | (.[0].number // empty)')

          if [ "$EXIT" != "0" ]; then
            BODY=$(jq -Rs --arg d "$(date +%F)" \
              '{body: ("lychee reported broken or unreachable links on https://audacis.net/ (checked " + $d + ", exit '"$EXIT"').\n\n```\n" + . + "\n```")}' \
              /tmp/lychee.txt)
            if [ -n "$NUM" ]; then
              printf '%s' "$BODY" | curl -sf -X PATCH -H "$AUTH" -H "Content-Type: application/json" "${API}/issues/${NUM}" -d @- > /dev/null
              echo "updated tracking issue #${NUM}"
            else
              printf '%s' "$BODY" | jq --arg t "$TITLE" '. + {title: $t}' \
                | curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" "${API}/issues" -d @- > /dev/null
              echo "created tracking issue"
            fi
          else
            if [ -n "$NUM" ]; then
              curl -sf -X PATCH -H "$AUTH" -H "Content-Type: application/json" "${API}/issues/${NUM}" \
                -d '{"state":"closed"}' > /dev/null
              echo "closed tracking issue #${NUM} (links healthy)"
            else
              echo "links healthy, no tracking issue"
            fi
          fi
