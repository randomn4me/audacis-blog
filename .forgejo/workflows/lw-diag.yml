name: lw-diag

# Temporary diagnostic for linkwatch. Two independent jobs so their pass/fail
# is visible per-task in `fj actions tasks` without needing logs:
#   egress   -> can the container reach pypi/github (apt + curl)?
#   checkout -> does actions/checkout work (i.e. is node present in container)?
# Delete after diagnosing.

on:
  workflow_dispatch:

jobs:
  egress:
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - name: reach pypi + github
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
          curl -sSf https://pypi.org/simple/ -o /dev/null
          curl -sSf https://github.com -o /dev/null
          echo EGRESS_OK

  checkout:
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
