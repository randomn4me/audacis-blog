base_url = "https://audacis.net"

title = "~/pkuehn"
description = "I'm Philipp and this is my webspace, where I write about current projects or ideas, discuss what moves me forward, or occupies me right now."

compile_sass = true
minify_html = true

build_search_index = true

generate_feeds = true
taxonomies = [{name = "tags", rss = true}]

theme = "apollo"

[markdown]
highlight_code = true
highlight_theme = "ayu-light"
bottom_footnotes = true

[search]
include_title = true
include_description = true
include_content = true
index_format = "elasticlunr_json"

[link_checker]
internal_level = "warn"

[extra]
toc = false
use_cdn = false
theme = "auto"
fancy_code = true
repo_url = "https://github.com/randomn4me/randomn4me.github.io/tree/main/content/"

menu = [
    { name = "/posts", url = "/posts", weight = 1 },
    { name = "/now", url = "/now", weight = 2 },
    { name = "/about", url = "/about", weight = 3 },
]

socials = [
    { name = "linkedin", url = "https://linkedin.com/in/ph-kuehn", icon = "linkedin" },
    { name = "github", url = "https://github.com/randomn4me/", icon = "github" },
]
