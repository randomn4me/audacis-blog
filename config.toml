title = "~/"
base_url = "https://audacis.net"
author = "Philipp Kühn"
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = true

generate_feeds = true 
feed_filenames = ["rss.xml"]

taxonomies = [
    {name = "tags", feed = true},
]

[markdown]

[markdown.highlighting]
theme = "tokyo-night"

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 0

[extra]
primary_color = "#951169"
secondary_color = "#732054"
gradient_rotation = 135
meta_separator = "•"
profile_image = "img/profile.png"
show_cv_intro = true
show_rss = true

favicon_emoji = "🚀"
# favicon = "/favicon.ico"


menu = [
    { name = "/blog", url = "@/blog/_index.md" },
    { name = "/now", url = "@/now.md" },
    { name = "/cv", url = "@/cv/_index.md" },
]

socials = [
    { name = "GitHub", url = "https://github.com/randomn4me", icon = "fa-brands fa-github" },
    { name = "LinkedIn", url = "https://linkedin.com/in/ph-kuehn", icon = "fa-brands fa-linkedin" },
    { name = "ORCiD", url = "https://orcid.org/0000-0002-1739-876X", icon = "fa-brands fa-orcid" },
    { name = "Email", url = "mailto:blog@audacis.net", icon = "fa-solid fa-envelope" },
]
