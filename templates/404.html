{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block extra_head %}
<style>
    .glitch-404 {
        position: relative;
        font-size: 6rem;
        margin: 0;
        display: inline-block;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        transform: skew(var(--skew, 0deg)) scale(var(--scale, 1));
    }

    .glitch-404::before,
    .glitch-404::after {
        content: attr(data-text);
        position: absolute;
        width: 100%;
        left: 0;
        top: 0;
        transition: clip-path 50ms ease-in;
    }

    .glitch-404::before {
        left: 2px;
        color: var(--glitch-cyan);
        text-shadow: 2px 0 var(--glitch-cyan);
        clip-path: polygon(0 var(--t1, 0%), 100% var(--t1, 0%), 100% var(--b1, 100%), 0 var(--b1, 100%));
    }

    .glitch-404::after {
        left: -2px;
        color: var(--glitch-magenta);
        text-shadow: -2px 0 var(--glitch-magenta);
        clip-path: polygon(0 var(--t2, 0%), 100% var(--t2, 0%), 100% var(--b2, 100%), 0 var(--b2, 100%));
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div style="text-align: center; padding: 4rem 1rem; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 class="glitch-404" data-text="404">404</h1>
        <h2 style="margin: 1rem 0;">Page Not Found</h2>
        <p style="margin: 1rem 0 2rem; color: var(--text-color); opacity: 0.8; max-width: 600px;">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
            <a href="{{ config.base_url }}" style="padding: 0.75rem 1.5rem; background: var(--gradient-primary); color: white; text-decoration: none; border-radius: 0.25rem; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                Go Home
            </a>
            <a href="{{ config.base_url }}/blog/" style="padding: 0.75rem 1.5rem; border: 2px solid var(--primary-color); color: var(--primary-color); text-decoration: none; border-radius: 0.25rem; transition: all 0.2s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='transparent'; this.style.color='var(--primary-color)'">
                View Blog
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function glitch(element) {
        let count = 0;
        setInterval(() => {
            // Main element skew
            const skew = Math.random() * 20 - 10;
            // element::before (primary color)
            const top1 = Math.random() * 100;
            const btm1 = Math.random() * 100;
            // element::after (secondary color)
            const top2 = Math.random() * 100;
            const btm2 = Math.random() * 100;

            element.style.setProperty('--skew', `${skew}deg`);
            element.style.setProperty('--t1', `${top1}%`);
            element.style.setProperty('--b1', `${btm1}%`);
            element.style.setProperty('--t2', `${top2}%`);
            element.style.setProperty('--b2', `${btm2}%`);
            element.style.setProperty('--scale', '1');

            count++;

            if (count % 15 === 0) {
                const bigSkew = Math.random() * 180 - 90;
                element.style.setProperty('--skew', `${bigSkew}deg`);
            }

            if (count % 30 === 0) {
                const bigScale = 1 + Math.random() / 2;
                element.style.setProperty('--scale', `${bigScale}`);
            }
        }, 200);
    }

    const h1 = document.querySelector('.glitch-404');
    if (h1) {
        glitch(h1);
    }
</script>
{% endblock %}
